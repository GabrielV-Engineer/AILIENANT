[pytest]
# Marker registration only. No existing test is retroactively marked —
# retrofitting a taxonomy onto the current suite is tracked separately (DEBT-157).
# New tests should adopt these going forward so `-m "not e2e"`-style filtering
# becomes possible without a config file needing to exist first.
markers =
    unit: pure-function/class tests with no real I/O, filesystem, or subprocess use.
    integration: exercises multiple real components together (DB, filesystem, subprocess).
    e2e: drives a real running instance end-to-end (e.g. a live server + HTTP/WS client).
