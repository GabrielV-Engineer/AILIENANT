[pytest]
# --junitxml is pytest's built-in reporter (no plugin dependency) — every local
# run and CI both get a structured, machine-readable result file to triage a
# failure from without re-parsing scrollback or re-running the suite.
addopts = --junitxml=test-results.xml

# LangGraph reports a node whose `config` parameter it cannot recognise by
# warning and then silently skipping injection — every DI seam inside that node
# becomes None while the suite stays green. Scoped to that one message rather
# than promoting all warnings, so it fails the run that introduces it instead of
# joining the scrollback nobody reads.
filterwarnings =
    error:The 'config' parameter should be typed:UserWarning

# Marker registration only. No existing test is retroactively marked —
# retrofitting a taxonomy onto the current suite is tracked separately (DEBT-157).
# New tests should adopt these going forward so `-m "not e2e"`-style filtering
# becomes possible without a config file needing to exist first.
markers =
    unit: pure-function/class tests with no real I/O, filesystem, or subprocess use.
    integration: exercises multiple real components together (DB, filesystem, subprocess).
    e2e: drives a real running instance end-to-end (e.g. a live server + HTTP/WS client).
