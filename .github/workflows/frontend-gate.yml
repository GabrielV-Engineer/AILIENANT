name: Frontend Gate

on:
  push:
    branches: [main]
    paths:
      - 'ailienant-extension/**'
      - '.github/workflows/frontend-gate.yml'
  pull_request:
    paths:
      - 'ailienant-extension/**'
      - '.github/workflows/frontend-gate.yml'
  schedule:
    # Nightly Playwright e2e run — not on every push/PR (spec: 12.15).
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual on-demand trigger — routed to e2e-nightly only (see both jobs'
    # `if:`), so it can verify a nightly-job fix without waiting for the cron.

permissions:
  contents: read

jobs:
  frontend-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ailienant-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ailienant-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile (type-check + lint + esbuild)
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Install xvfb
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test (VS Code extension host, headless)
        run: xvfb-run -a npm test

  e2e-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ailienant-extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ailienant-core/requirements.txt

      # e2e/run-backend.mjs only looks for a venv under ailienant-core/.venv or
      # ailienant-core/venv (Scripts/ or bin/) — a bare `python` on PATH is not
      # enough for Playwright's webServer to find an interpreter.
      - name: Provision backend venv
        working-directory: ailienant-core
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ailienant-extension
        run: npm ci

      # main.py only mounts /dashboard when ailienant-extension/dist/dashboard
      # exists (dist/ is gitignored) — without this the e2e suite has never
      # actually served real dashboard content on a fresh CI checkout. Runs
      # the bundler directly (not `npm run compile`) since type-check/lint are
      # already enforced by the frontend-gate job on every push/PR — redundant
      # here, and unwanted extra time in a job already fighting its budget.
      - name: Build dashboard bundle
        working-directory: ailienant-extension
        run: node esbuild.js

      - name: Install Playwright browsers
        working-directory: ailienant-extension
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: ailienant-extension
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ailienant-extension/playwright-report/
          retention-days: 14
