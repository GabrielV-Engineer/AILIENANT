name: Code Metrics Gate

on:
  push:
    branches: [main]
    paths:
      - 'ailienant-core/**'
      - 'ailienant-extension/src/**'
      - '.jscpd.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/code-metrics-gate.yml'
  pull_request:
    paths:
      - 'ailienant-core/**'
      - 'ailienant-extension/src/**'
      - '.jscpd.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/code-metrics-gate.yml'

permissions:
  contents: read

jobs:
  code-metrics:
    runs-on: ubuntu-latest
    # ADVISORY gate — signal for prioritizing refactors, not a merge blocker.
    # See CLAUDE.md §16 and docs/TECH_DEBT_BACKLOG.md's Debt Ratio section.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            ailienant-core/requirements.txt
            ailienant-core/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        working-directory: ailienant-core
        run: pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cyclomatic complexity (radon cc)
        working-directory: ailienant-core
        run: radon cc . -a -s --exclude "venv/*,*/venv/*,tests/*,*/tests/*"

      - name: Maintainability index (radon mi)
        working-directory: ailienant-core
        run: radon mi . -s --exclude "venv/*,*/venv/*,tests/*,*/tests/*"

      - name: Complexity gate (xenon, report-only)
        working-directory: ailienant-core
        run: xenon --max-absolute C --max-modules B --max-average A --exclude "venv/*,tests/*" . || true

      - name: Duplication (jscpd)
        run: npm run metrics:duplication
