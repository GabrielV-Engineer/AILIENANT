name: Backend Gate

on:
  push:
    branches: [main]
    paths:
      - 'ailienant-core/**'
      - '.github/workflows/backend-gate.yml'
  pull_request:
    paths:
      - 'ailienant-core/**'
      - '.github/workflows/backend-gate.yml'

permissions:
  contents: read

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ailienant-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            ailienant-core/requirements.txt
            ailienant-core/requirements-dev.txt

      # npx pyright needs Node even in this "backend" job.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy .

      - name: pyright
        run: npx pyright

      - name: pytest (with coverage)
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: ailienant-core/coverage.xml
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: ailienant-core/test-results.xml
          retention-days: 30
